<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Farm Verification</title><link rel="stylesheet" href="/frontend/css/style.css"></head><body><header class="nav"><div class="brand">🌱 CropGuard</div><nav><a href="/">Home</a><a href="/frontend/prediction.html">Prediction</a><a class="active" href="/frontend/verification.html">Verification</a><a href="/frontend/result.html">Result</a></nav></header><main class="container"><div class="page-head"><span class="eyebrow">GANACHE BLOCKCHAIN</span><h1>Farm Record Verification</h1><p>Register a compact farm record. The record hash is stored on-chain; large data is not stored on-chain.</p></div><form id="recordForm" class="card form-grid"><label>Farmer ID<input name="farmerId" required placeholder="FARM-001"></label><label>Farmer Name<input name="farmerName" required></label><label>Crop<input name="crop" required></label><label>Disease / Prediction<input name="disease" required></label><label class="full">Farm Information<textarea name="farmInfo" required placeholder="Village, acreage, irrigation, etc."></textarea></label><label class="full">Record Information<textarea name="recordInfo" required placeholder="Notes or inspection details"></textarea></label><div class="full"><button class="btn" type="submit">Register on Blockchain</button><span id="recordLoading" class="loading hidden">Submitting…</span></div></form><div id="recordError" class="alert error hidden"></div><section id="recordResult" class="result-card hidden"></section><div class="card verify-box"><h2>Verify an Existing Record</h2><label>Record ID<input id="verifyRecordId" placeholder="Record ID"></label><button id="verifyBtn" class="btn secondary">Verify</button><div id="verifyResult"></div></div></main><script src="/frontend/js/app.js"></script></body></html>
